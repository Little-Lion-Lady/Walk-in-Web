<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Dine now works — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --text-primary: #0c1118;
    --text-tertiary: #48515d;
    --text-quaternary: #5e6570;
    --teal-50: #e8fcf6;
    --teal-300: #7bdbc6;
    --teal-600: #108570;
    --teal-700: #126d61;
    --teal-800: #0c5048;
    --route: #24a38a;
    --pink-600: #b44295;
    --purple-600: #8759b5;
    --warning-600: #e1480d;
    --grey-track: #d9dade;
    --map-bg: #d9dade;
    --border-alpha: rgba(12, 17, 24, 0.1);
    --alpha-30: rgba(12, 17, 24, 0.3);
    --shadow-md: 0 2px 10px -1px rgba(47, 55, 66, 0.04), 0 1px 4px -2px rgba(47, 55, 66, 0.02);
    --shadow-lg: 0 6px 16px -4px rgba(47, 55, 66, 0.06), 0 2px 6px -2px rgba(47, 55, 66, 0.02), 0 1px 2px -1px rgba(47, 55, 66, 0.03);
    --shadow-sm: drop-shadow(0 1px 2.5px rgba(47, 55, 66, 0.05)) drop-shadow(0 1px 1px rgba(47, 55, 66, 0.05));
    --shadow-xs: drop-shadow(0 1px 1.5px rgba(47, 55, 66, 0.04));
    --font-display: "Abril Fatface", Georgia, serif;
    --font-body: "Open Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #fff;
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }


  /* ---------- how it works ---------- */
  .hiw { position: relative; /* height set from JS: 1 + steps × hold */ }
  .hiw__pin {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 40px;
    overflow: hidden;
  }
  .hiw__row {
    width: 100%;
    max-width: 1216px;
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .hiw__copy {
    flex: 1 0 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .hiw__title {
    margin: 0;
    font: 400 32px/38px var(--font-display);
    color: var(--text-primary);
  }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; }
  .step {
    all: unset;
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-left: 26px; /* 20px gap + 6px inner padding */
    cursor: pointer;
    max-width: 379px;
  }
  .step:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 4px; border-radius: 4px; }
  .step__track, .step__fill {
    position: absolute;
    left: -1.5px;
    top: 0;
    width: 3px;
    border-radius: 3px;
  }
  .step__track { bottom: 0; background: var(--grey-track); }
  .step__fill { height: calc(var(--p, 0) * 100%); background: var(--teal-600); } /* --p (0–1) is scrubbed by scroll, see scrubTick() */
  .step__title {
    font: 600 20px/26px var(--font-body);
    color: var(--text-quaternary);
    transition: color 250ms ease-out;
  }
  .step__body {
    font: 400 16px/28px var(--font-body);
    color: var(--text-quaternary);
    width: 353px;
    max-width: 100%;
    transition: color 250ms ease-out;
  }
  /* upcoming steps keep the quaternary default above */
  .step.is-active .step__title { color: var(--teal-800); }
  .step.is-active .step__body { color: var(--text-tertiary); }
  .step.is-done .step__title { color: var(--teal-600); }
  .step.is-done .step__body { color: var(--teal-700); }
  .step__bodywrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 300ms ease-out; }
  .step__bodywrap > * { overflow: hidden; }

  /* ---------- illustration ---------- */
  .ill-wrap { position: relative; flex: none; width: 500px; height: 460px; }
  .stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 500px;
    height: 460px;
    transform-origin: 0 0;
  }
  .layer { position: absolute; will-change: transform, opacity; }

  .map {
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: var(--map-bg);
    overflow: hidden;
    isolation: isolate;
  }
  /* 1px inner shadow, no blur, in place of a border; drawn on top so the map image can't cover it */
  .map::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px var(--border-alpha);
    pointer-events: none;
  }
  .mapvec { position: absolute; left: -1092.45px; top: -1544.64px; width: 2270.65px; height: 2698.55px; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; }
  /* the vector map is drawn rotated and skewed in Figma; its box above is the rotated bounds */
  .mapvec img { flex: none; width: 1930.95px; height: 2491.03px; transform: rotate(6.92deg) skewX(-1.24deg); display: block; }
  /* step 3: the map goes soft and green. A blurred copy of the map with teal-50 multiplied over it.
     (filter, not backdrop-filter: the fading opacity would stop a backdrop blur from working) */
  .tint { position: absolute; inset: 0; overflow: hidden; contain: paint; } /* only blur what's visible */
  .tint .mapvec { transform: translate(-376.80px, -433.41px) scale(1.24729); filter: blur(5px); } /* where step 2 leaves the map */
  .tint::after { content: ""; position: absolute; inset: 0; background: var(--teal-50); mix-blend-mode: multiply; }
  .phone { left: 112.64px; top: 54px; width: 274.73px; height: 438.2px; overflow: hidden; }
  /* iPhone mockup, cropped at the bottom as in Figma */
  .phone img { position: absolute; left: -0.61%; top: -0.01%; width: 100.91%; height: 128.22%; max-width: none; }

  .route { left: 205.86px; top: 146px; overflow: visible; }

  .me {
    left: 222.85px; top: 173.38px; width: 88.23px; height: 89.682px;
    display: flex; align-items: center; justify-content: center;
    transform-origin: 26.89px 55.89px; /* the dot, so zooming and turning keep it in place */
  }
  .me__rot { position: relative; width: 68.274px; height: 58.186px; transform: rotate(-50.84deg); flex: none; }
  .me__rot img { position: absolute; top: 0; bottom: 0; right: 0; left: -7.77%; width: 107.77%; height: 100%; display: block; }

  .pin-group { transform-origin: var(--ox) var(--oy); }
  .photo { position: absolute; display: flex; align-items: center; justify-content: center; }
  .photo__card {
    flex: none;
    display: flex;
    flex-direction: column;
    padding: 4px;
    background: #fff;
    border: 1px solid var(--border-alpha);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .photo__inner {
    position: relative;
    flex: 1 0 0;
    min-height: 1px;
    border: 1px solid var(--border-alpha);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
  }
  .photo__inner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

  .tooltip { position: absolute; width: 124px; display: flex; flex-direction: column; align-items: center; filter: var(--shadow-sm); }
  .tooltip__body {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 12px 16px;
    border-radius: 24px;
    background: var(--teal-600);
  }
  .tooltip__body img { width: 20px; height: 20px; display: block; flex: none; }
  .tooltip__label { padding: 0 6px; font: 600 16px/22px var(--font-body); color: #fff; white-space: nowrap; }
  .tooltip__tail { position: relative; width: 16px; height: 6px; }
  .tooltip__tail img { position: absolute; left: 0; right: 0; bottom: 0; top: -41.91%; width: 100%; height: 141.91%; display: block; }

  .chip {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 20px;
    border-radius: 9999px;
    overflow: hidden;
    white-space: nowrap;
  }
  .chip img { width: 20px; height: 20px; display: block; flex: none; }
  .chip span { padding: 0 6px; font: 600 16px/22px var(--font-body); color: #fff; }
  .chip--pink { background: var(--pink-600); }
  .chip--purple { background: var(--purple-600); }
  .chip--orange { background: var(--warning-600); }
  .tag-wrap { width: 126px; height: 56px; transform-origin: 50% 50%; }
  .tag-wrap--hi { left: -34px; top: 19.69px; }
  .tag-wrap--hi .chip { transform: rotate(3.4deg); }
  .tag-wrap--show { left: 297.48px; top: 412.26px; width: 223px; }
  .tag-wrap--show .chip { transform: rotate(-6.6deg); }

  .card {
    left: -89px; top: 281px; width: 364px;
    padding: 20px;
    border-radius: 24px;
    border: 1px solid var(--border-alpha);
    background: var(--teal-700);
    filter: drop-shadow(0 2px 5px rgba(47, 55, 66, 0.04)) drop-shadow(0 1px 2px rgba(47, 55, 66, 0.02));
    display: flex;
    flex-direction: column;
    gap: 16px;
    color: #fff;
    transform-origin: 50% 50%;
  }
  .card__head { display: flex; gap: 12px; align-items: flex-start; }
  .card__icon { padding-top: 2px; width: 24px; flex: none; }
  .card__icon img { width: 20px; height: 20px; display: block; }
  .card__time { margin: 0; font: 600 20px/26px var(--font-body); }
  .card__countdown {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--alpha-30);
  }
  .card__countdown span:first-child { flex: 1; font: 600 20px/26px var(--font-body); }
  .card__countdown span:last-child { font: 600 24px/32px var(--font-body); letter-spacing: -0.24px; }

  .xfade { position: absolute; inset: 0; pointer-events: none; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- mobile: stack copy above illustration ---------- */
  @media (max-width: 899px) {
    .hiw__pin { padding: 0 16px; align-items: stretch; }
    .hiw__row {
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 24px;
      padding: 24px 0;
    }
    /* order: title, illustration, progress bars, active step's copy */
    .hiw__copy { display: contents; }
    .hiw__title { order: 0; font-size: 28px; line-height: 34px; }
    .ill-wrap { order: 1; width: 100%; }
    .steps {
      order: 2;
      position: relative;
      display: grid;
      padding-top: 23px; /* 3px bars + 20px gap */
      gap: 0;
    }
    /* all three steps share one grid cell, so the copy swaps without the layout jumping */
    .steps > li { grid-area: 1 / 1; }
    .steps > li :is(.step__title, .step__bodywrap) { transition: opacity 250ms ease-out, color 250ms ease-out; }
    .step:not(.is-active) { pointer-events: none; }
    .step:not(.is-active) :is(.step__title, .step__bodywrap) { opacity: 0; }
    .step { position: static; padding-left: 0; max-width: none; }
    /* bars sit side by side across the top, filling left to right */
    .step__track, .step__fill {
      top: 0;
      height: 3px;
      width: calc((100% - 24px) / 3);
    }
    .steps > li:nth-child(1) :is(.step__track, .step__fill) { left: 0; }
    .steps > li:nth-child(2) :is(.step__track, .step__fill) { left: calc((100% - 24px) / 3 + 12px); }
    .steps > li:nth-child(3) :is(.step__track, .step__fill) { left: calc((100% - 24px) / 3 * 2 + 24px); }
    .step__fill { width: calc(var(--p, 0) * (100% - 24px) / 3); }
    .step__body { width: auto; }
    /* keep the arrival card and the "Say hi!" tag on screen */
    .card { left: -8px; }
    .tag-wrap--hi { left: -8px; }
  }
</style>
</head>
<body>


<section class="hiw" id="hiw" aria-labelledby="hiw-title">
  <div class="hiw__pin">
    <div class="hiw__row">
      <div class="hiw__copy">
        <h2 class="hiw__title" id="hiw-title">How Dine now works</h2>
        <ol class="steps">
          <li><button class="step" type="button" data-step="1">
            <span class="step__track" aria-hidden="true"></span><span class="step__fill" aria-hidden="true"></span>
            <span class="step__title">Claim</span>
            <span class="step__bodywrap"><span><span class="step__body" style="display:block">Browse offers at restaurants near you and claim the one you like</span></span></span>
          </button></li>
          <li><button class="step" type="button" data-step="2">
            <span class="step__track" aria-hidden="true"></span><span class="step__fill" aria-hidden="true"></span>
            <span class="step__title">Arrive</span>
            <span class="step__bodywrap"><span><span class="step__body" style="display:block">Your offer comes with a flexible arrival window, so you can get there when it suits you</span></span></span>
          </button></li>
          <li><button class="step" type="button" data-step="3">
            <span class="step__track" aria-hidden="true"></span><span class="step__fill" aria-hidden="true"></span>
            <span class="step__title">Present</span>
            <span class="step__bodywrap"><span><span class="step__body" style="display:block">Show the offer confirmation screen to staff, and enjoy 30% off your food.</span></span></span>
          </button></li>
        </ol>
      </div>

      <div class="ill-wrap" id="ill-wrap" role="img" aria-label="Map showing nearby venues with 30% off offers">
        <div class="stage" id="stage" aria-hidden="true">
          <div class="map">
            <div class="mapvec layer" data-el="map"><img src="assets/map.svg" alt=""></div>
            <div class="tint layer" data-el="tint"><div class="mapvec"><img src="assets/map.svg" alt=""></div></div>
            <div class="phone layer" data-el="phone"><img src="assets/phone-mockup.png" alt=""></div>
          </div>

          <svg class="route layer" data-el="route" width="180.354" height="110.031" viewBox="0 0 180.354 110.031" fill="none">
            <defs>
              <radialGradient id="glow-dot">
                <stop offset="0" stop-color="#fff" stop-opacity="1"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </radialGradient>
              <mask id="glow-mask" maskUnits="userSpaceOnUse" x="-40" y="-40" width="250" height="180">
                <g id="glow-dots"></g>
              </mask>
            </defs>
            <path id="route-path" d="M4.00046 85.3185L158.835 105.986C161.594 106.354 164.123 104.398 164.46 101.634L176.353 4.00041" stroke="var(--route)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
            <path id="route-glow" d="M4.00046 85.3185L158.835 105.986C161.594 106.354 164.123 104.398 164.46 101.634L176.353 4.00041" stroke="#d4fbef" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" mask="url(#glow-mask)" opacity="0"/>
          </svg>

          <div class="me layer" data-el="me">
            <div class="me__rot"><img src="assets/me.svg" alt=""></div>
          </div>

          <!-- pin groups are generated from PINS below; each is its own layer -->
          <div id="pins"></div>

          <div class="card layer" data-el="card">
            <div class="card__head">
              <div class="card__icon"><img src="assets/clock.svg" alt=""></div>
              <p class="card__time">Arrive between<br>12:30PM - 1:00PM</p>
            </div>
            <div class="card__countdown"><span>Offer activates in</span><span id="countdown">4:59</span></div>
          </div>

          <div class="chip chip--pink layer" data-el="chipPink" style="left:63px;top:-30px">
            <img src="assets/clock.svg" alt=""><span>Available right now</span>
          </div>
          <div class="chip chip--purple layer" data-el="chipPurple" style="left:381px;top:233px">
            <img src="assets/marker-pin.svg" alt=""><span>Nearby</span>
          </div>
          <div class="chip chip--orange layer" data-el="chipOrange" style="left:155px;top:426px">
            <img src="assets/footprints.svg" alt=""><span>Just walk in</span>
          </div>

          <div class="tag-wrap tag-wrap--hi layer" data-el="tagHi">
            <div class="chip chip--pink"><img src="assets/hand.svg" alt=""><span>Say hi!</span></div>
          </div>
          <div class="tag-wrap tag-wrap--show layer" data-el="tag">
            <div class="chip chip--orange"><img src="assets/eye.svg" alt=""><span>Show confirmation</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


<script>
/* =====================================================================
   TIMING — every tweakable number lives here (ms unless noted)
   ===================================================================== */
const TIMING = {
  stepHoldVh: [0.9, 1.3, 0.9],  // scroll distance each step holds, in viewport heights (step 1, 2, 3)
  countdownFrom: 299,     // step 2 card's "Offer activates in" timer, seconds (4:59)
  enterAt: 0.5,           // step 1 plays once the section top is above this fraction of the viewport
  pinPop:   { duration: 420, stagger: 80, fromScale: 0.6, damping: 0.8 }, // soft pop, barely any overshoot
  pop:      { duration: 300, fromScale: 0.8, damping: 0.75 }, // light spring
  fade:     { duration: 250 },                               // ease-out
  zoom:     { duration: 500 },                               // step 2 map zoom, ease-in-out
  lineDraw: { duration: 600 },                               // ease-in-out
  turn:     { duration: 500 },                               // user's dot turns to face the route while it draws, ease-in-out
  toStep3:  { fadeOut: 300, blur: 450 },                     // step 2 layers fade out (ease-out) while the map blurs and turns green (ease-in-out)
  // step 3 phone slides up from below the map's bottom edge, following the scroll: fully up after
  // `span` of step 3's scroll progress (0–1). `duration` is only the catch-up when step 3 starts.
  phoneRise: { span: 0.2, distance: 420, duration: 270 },
  glow:     { duration: 1400, pause: 250, tail: 7 },         // travelling gradient loop on the route
  catchUp: 3,             // playback speed while the user scrolls past several steps at once
  crossfade: 300,         // reduced-motion state swap, and the skip when tapping a step
  jumpTimeout: 1500,      // fallback end of a tapped step's smooth scroll (browsers without scrollend)
  // step 1 pills pop in (same pop as step 3's tags) as the scroll passes each point
  // in step 1's scroll progress (0–1), and pop back out when you scroll back past it
  pills:    { at: [0.07, 0.27, 0.47] },
  tags:     { at: [0.26, 0.4] },  // after the phone is up   // same for step 3's "Say hi!" and "Show confirmation", in step 3's scroll progress
  popStagger: 200,        // when several scroll pops are due at once (fast scroll), they queue this many ms apart
  scrubSmoothing: 0.16,   // 0–1: how quickly the progress bars and pills catch up with the scroll
};

/* ---------- easing ---------- */
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
// Damped spring normalised so it has settled (≈0.1%) by t = 1. Lower damping = more overshoot.
const spring = z => {
  const zw = 6.9, w = zw / z, wd = w * Math.sqrt(1 - z * z);
  return t => (t >= 1 ? 1 : 1 - Math.exp(-zw * t) * (Math.cos(wd * t) + (zw / wd) * Math.sin(wd * t)));
};

const PROFILES = {
  pinPop:   () => ({ duration: TIMING.pinPop.duration, ease: spring(TIMING.pinPop.damping), opacityEase: easeOut }),
  pop:      () => ({ duration: TIMING.pop.duration, ease: spring(TIMING.pop.damping), opacityEase: easeOut }),
  fade:     () => ({ duration: TIMING.fade.duration, ease: easeOut }),
  zoom:     () => ({ duration: TIMING.zoom.duration, ease: easeInOut }),
  lineDraw: () => ({ duration: TIMING.lineDraw.duration, ease: easeInOut }),
  turn:     () => ({ duration: TIMING.turn.duration, ease: easeInOut }),
  fadeOut:  () => ({ duration: TIMING.toStep3.fadeOut, ease: easeOut }),
  blur:     () => ({ duration: TIMING.toStep3.blur, ease: easeInOut }),
  rise:     () => ({ duration: TIMING.phoneRise.duration, ease: easeOut }),
};

/* ---------- pin groups (Figma "Group 1/2/3/5"; coords relative to each group) ---------- */
const PINS = [
  { key: 'pin1', left: 22.23, top: 238.57, origin: [78, 148], tooltip: [16, 96], photos: [
    { x: 0, y: 0, w: 121.418, h: 130.618, t: 'rotate(-13.18deg)', cw: 98.701, ch: 111.039, src: 'pin1-a.jpg' },
    { x: 43.24, y: 15.96, w: 104.297, h: 113.207, t: 'rotate(10.99deg)', cw: 87.138, ch: 98.401, src: 'pin1-b.jpg' } ] },
  { key: 'pin2', left: 63.81, top: 36, origin: [69.6, 145], tooltip: [7.6, 93], photos: [
    { x: 0, y: 0, w: 107.952, h: 124.419, t: 'rotate(-8.16deg) skewX(-1.09deg)', cw: 95.154, ch: 111.767, src: 'pin2-a.jpg' },
    { x: 34.78, y: 15.45, w: 104.402, h: 106.597, t: 'rotate(11.99deg) skewX(2.07deg)', cw: 91.053, ch: 89.006, src: 'pin2-b.jpg' } ] },
  { key: 'pin3', left: 335.71, top: 303.88, origin: [68, 134.35], tooltip: [6, 82.35], photos: [
    { x: 0, y: 3.27, w: 108.829, h: 112.602, t: 'rotate(166.51deg) scaleY(-1)', cw: 89.272, ch: 94.377, src: 'pin3-a.jpg' },
    { x: 22.38, y: 0, w: 103.955, h: 114.326, t: 'rotate(-171.09deg) scaleY(-1)', cw: 89.272, ch: 101.721, src: 'pin3-b.jpg' } ] },
  // top-right pin — stays for step 2, at the end of the route
  { key: 'pinKeep', left: 319.71, top: 60.23, origin: [62, 133.38], tooltip: [0, 81.38], photos: [
    { x: 31.09, y: 1.93, w: 108.695, h: 112.464, t: 'rotate(13.49deg)', cw: 89.162, ch: 94.261, src: 'pin3-a.jpg' },
    { x: 1.84, y: 0, w: 97.405, h: 108.954, t: 'rotate(-4.35deg)', cw: 89.89, ch: 102.426, src: 'pin3-b.jpg' } ] },
];

const pinsHost = document.getElementById('pins');
for (const p of PINS) {
  const g = document.createElement('div');
  g.className = 'pin-group layer';
  g.dataset.el = p.key;
  g.style.cssText = `left:${p.left}px;top:${p.top}px;width:1px;height:1px;--ox:${p.origin[0]}px;--oy:${p.origin[1]}px`;
  g.innerHTML = p.photos.map(ph => `
    <div class="photo" style="left:${ph.x}px;top:${ph.y}px;width:${ph.w}px;height:${ph.h}px">
      <div class="photo__card" style="width:${ph.cw}px;height:${ph.ch}px;transform:${ph.t}">
        <div class="photo__inner"><img src="assets/${ph.src}" alt=""></div>
      </div>
    </div>`).join('') + `
    <div class="tooltip" style="left:${p.tooltip[0]}px;top:${p.tooltip[1]}px">
      <div class="tooltip__body"><img src="assets/lightning.svg" alt=""><span class="tooltip__label">30% off</span></div>
      <div class="tooltip__tail"><img src="assets/tooltip-tail.svg" alt=""></div>
    </div>`;
  pinsHost.appendChild(g);
}

/* =====================================================================
   STATES — what every layer looks like at rest in each state.
   0 = before the section is reached, 1–3 = the three steps.
   ===================================================================== */
const ZOOM = 1.24729;             // step 2 map is the step 1 map scaled up
const ME_ZOOM = 1189 / 972;          // the dot and cone grow a little less than the map
const PIN_FROM = TIMING.pinPop.fromScale;
const TURN = 43.7;   // degrees: the cone turns from facing up-right to facing along the route's first leg
const POP_OUT = { o: 0, s: TIMING.pop.fromScale };
const RISE = TIMING.phoneRise.distance;
const S = {
  map:        [{ x: 0, y: 0, s: 1 }, { x: 0, y: 0, s: 1 }, { x: -376.80, y: -433.41, s: ZOOM }, { x: -376.80, y: -433.41, s: ZOOM }],
  tint:       [{ o: 0 }, { o: 0 }, { o: 0 }, { o: 1 }],
  phone:      [{ y: RISE }, { y: RISE }, { y: RISE }, { y: 0 }], // hidden below the map's clipped bottom edge
  route:      [{ o: 1, y: 0, d: 0 }, { o: 1, y: 0, d: 0 }, { o: 1, y: 0, d: 1 }, { o: 0, y: 0, d: 1 }],
  me:         [{ o: 1, x: 0, y: 0, s: 1, r: 0 }, { o: 1, x: 0, y: 0, s: 1, r: 0 }, { o: 1, x: -38.86, y: -6.9, s: ME_ZOOM, r: TURN }, { o: 0, x: -38.86, y: -6.9, s: ME_ZOOM, r: TURN }],
  pin1:       [{ o: 0, s: PIN_FROM }, { o: 1, s: 1 }, { o: 0, s: 1 }, { o: 0, s: 1 }],
  pin2:       [{ o: 0, s: PIN_FROM }, { o: 1, s: 1 }, { o: 0, s: 1 }, { o: 0, s: 1 }],
  pin3:       [{ o: 0, s: PIN_FROM }, { o: 1, s: 1 }, { o: 0, s: 1 }, { o: 0, s: 1 }],
  pinKeep:    [{ o: 0, s: PIN_FROM, x: 0, y: 0 }, { o: 1, s: 1, x: 0, y: 0 }, { o: 1, s: 1, x: 0.5, y: -16.24 }, { o: 0, s: 1, x: 0.5, y: -16.24 }],
  card:       [{ o: 0, s: 0.8, y: 0 }, { o: 0, s: 0.8, y: 0 }, { o: 1, s: 1, y: 0 }, { o: 0, s: 1, y: 0 }],
  chipPink:   [POP_OUT, null, POP_OUT, POP_OUT], // step 1 comes from scroll
  chipPurple: [POP_OUT, null, POP_OUT, POP_OUT], // step 1 comes from scroll
  chipOrange: [POP_OUT, null, POP_OUT, POP_OUT], // step 1 comes from scroll
  tagHi:      [{ o: 0, s: 0.8 }, { o: 0, s: 0.8 }, { o: 0, s: 0.8 }, { o: 1, s: 1 }],
  tag:        [{ o: 0, s: 0.8 }, { o: 0, s: 0.8 }, { o: 0, s: 0.8 }, { o: 1, s: 1 }],
};
// the pop-in start scale is tweakable
for (const k of ['card', 'tagHi', 'tag']) S[k].forEach(st => { if (st.s !== 1) st.s = TIMING.pop.fromScale; });

/* =====================================================================
   CHOREOGRAPHY — transition INTO step n, as stages that run one after another.
   Scrolling back plays the same stages in reverse order, time-reversed.
   ===================================================================== */
const PILLS = ['chipPink', 'chipPurple', 'chipOrange'];   // order they appear in
const TRANSITIONS = {
  1: [
    ['pin1', 'pin2', 'pin3', 'pinKeep'].map((k, i) => ({ k, p: 'pinPop', delay: i * TIMING.pinPop.stagger })),
    PILLS.map((k, i) => ({ k, p: 'pop', delay: i * TIMING.popStagger })),
  ],
  2: [
    [...['pin1', 'pin2', 'pin3', 'chipPink', 'chipPurple', 'chipOrange'].map(k => ({ k, p: 'fade' })),
     { k: 'map', p: 'zoom' }, { k: 'me', p: 'zoom', except: ['r'] }, { k: 'pinKeep', p: 'zoom' }],
    // the route draws while the dot turns to face along it
    [{ k: 'route', p: 'lineDraw' }, { k: 'me', p: 'turn', only: ['r'] }],
    [{ k: 'card', p: 'pop' }],
  ],
  3: [
    // step 2 fades away in place while the map blurs and turns green
    [...['pinKeep', 'me', 'route', 'card'].map(k => ({ k, p: 'fadeOut' })), { k: 'tint', p: 'blur' }],
    [{ k: 'phone', p: 'rise' }],
    ['tagHi', 'tag'].map((k, i) => ({ k, p: 'pop', delay: i * TIMING.popStagger })),
  ],
};

/* ---------- layers ---------- */
const stage = document.getElementById('stage');
const routePath = document.getElementById('route-path');
const L = {};
function bindLayers(root) {
  for (const el of root.querySelectorAll('[data-el]')) {
    const k = el.dataset.el;
    L[k] = { el, st: { ...S[k][0] } };
    render(k);
  }
}
function render(k) {
  const { el, st } = L[k];
  if ('o' in st) el.style.opacity = st.o;
  if (k === 'route') { routePath.style.strokeDashoffset = 1 - st.d; }
  const x = st.x || 0, y = st.y || 0, s = st.s ?? 1, r = st.r || 0;
  if ('x' in st || 'y' in st || 's' in st) el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;
}
// Resting state of layer k in state n. Some layers pop in with scroll: step 1's pills and
// step 3's tags each appear once you've scrolled past their point in that step.
const SCROLL_POPS = {
  1: { keys: PILLS, at: () => TIMING.pills.at },
  3: { keys: ['tagHi', 'tag'], at: () => TIMING.tags.at },
};
const isScrollPop = k => Object.values(SCROLL_POPS).some(g => g.keys.includes(k));
let stepProgress = [0, 0, 0];
let popProgress = [0, 0, 0];   // step progress the scroll pops follow (the destination's, during a step jump)
const phoneY = () => RISE * (1 - easeOut(Math.min(1, popProgress[2] / TIMING.phoneRise.span)));
function getState(k, n) {
  if (k === 'phone' && n === 3) return { y: phoneY() };
  const g = SCROLL_POPS[n], i = g ? g.keys.indexOf(k) : -1;
  if (i < 0) return S[k][n];
  return popProgress[n - 1] >= g.at()[i] ? { o: 1, s: 1 } : POP_OUT;
}
function applyState(n) { for (const k in L) { Object.assign(L[k].st, getState(k, n)); render(k); } }

/* ---------- tiny tween engine ---------- */
let timeScale = 1;
const tweens = new Set();
let rafId = 0, last = 0;
function tick(now) {
  const dt = Math.min(64, now - last) * timeScale;
  last = now;
  for (const tw of tweens) tw.step(dt);
  rafId = tweens.size ? requestAnimationFrame(tick) : 0;
}
function tween(k, to, { duration, ease, opacityEase }, { delay = 0, reverse = false } = {}) {
  const from = { ...L[k].st };
  const rev = e => (reverse ? t => 1 - e(1 - t) : e);
  const e = rev(ease), eo = rev(opacityEase || ease);
  return new Promise(resolve => {
    let elapsed = 0;
    const tw = {
      step(dt) {
        elapsed += dt;
        const t = Math.max(0, Math.min(1, (elapsed - delay) / duration));
        for (const p in to) {
          const f = p === 'o' ? eo : e;
          L[k].st[p] = from[p] + (to[p] - from[p]) * f(t);
        }
        render(k);
        if (t >= 1) { Object.assign(L[k].st, to); render(k); tweens.delete(tw); resolve(); }
      },
      cancel() { tweens.delete(tw); resolve(); },   // stops where it is
    };
    tweens.add(tw);
    if (!rafId) { last = performance.now(); rafId = requestAnimationFrame(tick); }
  });
}

// play the transition into step n (forward: n-1 → n) or out of it (reverse: n → n-1)
// an item can animate only some of a layer's properties (`only`) or all but some (`except`)
function pickProps(st, { only, except }) {
  const out = {};
  for (const p in st) if ((!only || only.includes(p)) && !(except || []).includes(p)) out[p] = st[p];
  return out;
}
function cancelAll() { for (const tw of [...tweens]) tw.cancel(); }
let gen = 0;   // bumped to abandon whatever sequence is playing
let heading = null;   // state the in-flight transition is heading to
async function play(n, forward, g) {
  const stages = forward ? TRANSITIONS[n] : [...TRANSITIONS[n]].reverse();
  const dest = forward ? n : n - 1;
  for (const items of stages) {
    if (g !== gen) return;
    const maxDelay = Math.max(...items.map(i => i.delay || 0));
    await Promise.all(items.map(i =>
      tween(i.k, pickProps(getState(i.k, dest), i), PROFILES[i.p](), { delay: forward ? i.delay || 0 : maxDelay - (i.delay || 0), reverse: !forward && !isScrollPop(i.k) })));
    for (const k in popShown) popShown[k] = L[k].st.o > 0.5;
  }
}

/* ---------- travelling gradient on the route (step 2 only) ---------- */
const glowPath = document.getElementById('route-glow');
const glowDots = document.getElementById('glow-dots');
const routeLen = glowPath.getTotalLength(); // glow path has no pathLength, so lengths are real units
let glowRaf = 0;
function buildGlow() {
  glowDots.innerHTML = '';
  for (let i = 0; i < TIMING.glow.tail; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', 16 - i);
    c.setAttribute('fill', 'url(#glow-dot)');
    c.setAttribute('fill-opacity', (1 - i / TIMING.glow.tail).toFixed(2));
    glowDots.appendChild(c);
  }
}
function startGlow() {
  if (glowRaf || reduced) return;
  buildGlow();
  const t0 = performance.now();
  const total = TIMING.glow.duration + TIMING.glow.pause;
  const loop = now => {
    const phase = ((now - t0) % total) / TIMING.glow.duration;  // > 1 during the pause
    const env = phase > 1 ? 0 : Math.min(1, phase / 0.1, (1 - phase) / 0.15);
    glowPath.setAttribute('opacity', env.toFixed(3));
    const head = Math.min(phase, 1) * routeLen;
    [...glowDots.children].forEach((c, i) => {
      const pt = glowPath.getPointAtLength(Math.max(0, head - i * 9));
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
    });
    glowRaf = requestAnimationFrame(loop);
  };
  glowRaf = requestAnimationFrame(loop);
}
// step 2 card counts down once step 2 has settled; it restarts at 4:59 whenever the card comes back
const countdownEl = document.getElementById('countdown');
let countdownTimer = 0, countdownLeft = TIMING.countdownFrom;
const showCountdown = () => { countdownEl.textContent = `${Math.floor(countdownLeft / 60)}:${String(countdownLeft % 60).padStart(2, '0')}`; };
function resetCountdown() { stopCountdown(); countdownLeft = TIMING.countdownFrom; showCountdown(); }
function startCountdown() {
  if (countdownTimer) return;
  countdownTimer = setInterval(() => {
    if (countdownLeft > 0) { countdownLeft--; showCountdown(); } else stopCountdown();
  }, 1000);
}
function stopCountdown() { clearInterval(countdownTimer); countdownTimer = 0; }
function stopGlow() {
  cancelAnimationFrame(glowRaf); glowRaf = 0;
  glowPath.setAttribute('opacity', 0);
}

/* =====================================================================
   CONTROLLER — scroll picks a target step; the illustration walks to it
   one transition at a time, each on its own timing.
   ===================================================================== */
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = reduceMQ.matches;
let settled = 0, target = 0, running = false;

let jumpTo = null;   // step we're smooth-scrolling to after a tap
function setTarget(n) {
  if (jumpTo !== null) return;   // mid step-jump: endJump() re-syncs when the scroll lands
  if (n === target) return;
  target = n;
  updateCopy();
  if (reduced) return crossfadeTo(n);
  if (running) timeScale = TIMING.catchUp; else run();
}
async function run() {
  const g = gen;
  running = true;
  stopGlow();
  while (settled !== target) {
    const dir = Math.sign(target - settled);
    timeScale = Math.abs(target - settled) > 1 ? TIMING.catchUp : 1;
    heading = settled + dir;
    if (heading === 2) resetCountdown();
    await play(dir > 0 ? settled + 1 : settled, dir > 0, g);
    if (g !== gen) return;   // a step jump took over
    settled += dir;
    heading = null;
  }
  running = false;
  timeScale = 1;
  if (settled === 2) { startGlow(); startCountdown(); } else stopCountdown();
  startScrub();
}

// reduced motion: snapshot the current picture, jump to the new state underneath, fade the snapshot out
let xfadeEl = null;
function crossfadeTo(n) {
  xfadeEl?.remove();
  const snap = stage.cloneNode(true);
  snap.removeAttribute('id');
  snap.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  snap.classList.add('xfade');
  snap.style.transform = stage.style.transform;
  stage.parentNode.appendChild(snap);
  xfadeEl = snap;
  applyState(n);
  settled = n;
  if (n === 2) { resetCountdown(); startCountdown(); } else stopCountdown();
  snap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: TIMING.crossfade, easing: 'ease-out', fill: 'forwards' })
    .finished.then(() => { snap.remove(); if (xfadeEl === snap) xfadeEl = null; });
}
reduceMQ.addEventListener('change', e => {
  reduced = e.matches;
  gen++; cancelAll(); running = false; timeScale = 1;
  stopGlow();
  applyState(target); settled = target;
  if (!reduced && settled === 2) startGlow();
});

/* ---------- copy column ---------- */
const stepBtns = [...document.querySelectorAll('.step')];
const ARIA = [
  'Map showing nearby venues with 30% off offers',
  'Map showing nearby venues with 30% off offers',
  'Route from your location to the venue. Arrive between 12:30PM and 1:00PM',
  'Phone showing the claim confirmation screen',
];
function updateCopy() {
  const active = Math.max(1, target);
  stepBtns.forEach((b, i) => {
    const n = i + 1;
    b.classList.toggle('is-active', n === active);
    b.classList.toggle('is-done', n < active);
    if (n === active) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  document.getElementById('ill-wrap').setAttribute('aria-label', ARIA[target]);
}

/* ---------- scroll + layout ---------- */
const section = document.getElementById('hiw');
const STEPS = 3;
const vh = () => window.innerHeight;
// scroll distance (px) from the section top to where step i (0-based) starts
const stepStart = i => TIMING.stepHoldVh.slice(0, i).reduce((a, b) => a + b, 0) * vh();
function sizeSection() {
  section.style.height = `${(1 + TIMING.stepHoldVh.reduce((a, b) => a + b, 0)) * 100}vh`;
}
// Scroll-linked values (progress bars, step 1 pills) chase the scroll position with a
// little smoothing, so wheel ticks don't show up as jumps.
const fills = stepBtns.map(b => b.querySelector('.step__fill'));
const fillNow = [0, 0, 0];
let scrubRaf = 0, scrubLast = 0;
// pop each scroll-driven layer of step n in or out as the scroll crosses its point
const popShown = {};
Object.values(SCROLL_POPS).forEach(g => g.keys.forEach(k => { popShown[k] = false; }));
function syncPops(n) {
  let delay = 0;   // several due at once: pop them in one after the other
  for (const k of SCROLL_POPS[n]?.keys || []) {
    const to = getState(k, n), want = to.o > 0.5;
    if (want === popShown[k]) continue;
    popShown[k] = want;
    if (reduced) { Object.assign(L[k].st, to); render(k); continue; }
    tween(k, to, PROFILES.pop(), { delay: want ? delay : 0 });
    if (want) delay += TIMING.popStagger;
  }
}
function startScrub() {
  if (!scrubRaf) { scrubLast = performance.now(); scrubRaf = requestAnimationFrame(scrubTick); }
}
function scrubTick(now) {
  const k = 1 - Math.pow(1 - TIMING.scrubSmoothing, Math.min(64, now - scrubLast) / 16.7);
  scrubLast = now;
  let moving = false;
  const follow = (cur, tgt) => {
    if (Math.abs(tgt - cur) < 0.001) return tgt;
    moving = true;
    return cur + (tgt - cur) * k;
  };
  fills.forEach((f, i) => {
    fillNow[i] = follow(fillNow[i], stepProgress[i]);
    f.style.setProperty('--p', fillNow[i].toFixed(4));
  });
  // scroll pops belong to the scroll only while the illustration is resting on their step
  if (settled === target && !running) {
    syncPops(settled);
    if (settled === 3) { L.phone.st.y = follow(L.phone.st.y, phoneY()); render('phone'); }   // phone tracks the scroll
  }
  scrubRaf = moving ? requestAnimationFrame(scrubTick) : 0;
}
function onScroll() {
  const top = section.getBoundingClientRect().top;
  stepProgress = stepProgress.map((_, i) => Math.min(1, Math.max(0, (-top - stepStart(i)) / (TIMING.stepHoldVh[i] * vh()))));
  if (jumpTo === null) popProgress = [...stepProgress];
  startScrub();
  if (top > vh() * TIMING.enterAt) return setTarget(0);
  let n = 1;
  while (n < STEPS && -top >= stepStart(n)) n++;
  setTarget(n);
}
let scrollQueued = false;
addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; onScroll(); });
}, { passive: true });

// Tapping a step plays that step's own animation, whichever direction you're going:
// the illustration crossfades to the state just before the chosen step, then the chosen
// step animates in. Steps in between never play. Scrolling still plays everything in order.
let jumpTimer = 0;
function endJump() {
  if (jumpTo === null) return;
  jumpTo = null;
  clearTimeout(jumpTimer);
  onScroll();   // sync with wherever the scroll actually ended up
}
stepBtns.forEach((b, i) => b.addEventListener('click', () => {
  const n = i + 1;
  const land = n === 3 ? TIMING.phoneRise.span : 0;   // step 3: land with the phone already up
  const y = section.getBoundingClientRect().top + scrollY + stepStart(i) + land * TIMING.stepHoldVh[i] * vh() + 2;
  if (n !== target || running) {
    const wasRunning = running;
    gen++; cancelAll(); stopGlow(); running = false; timeScale = 1; heading = null;
    const g = gen;
    popProgress = [0, 0, land];   // where we'll land: scroll pops still hidden, step 3's phone up
    target = n;
    updateCopy();
    // ignore the scroll positions the smooth scroll passes through; stop once it lands,
    // or once the user interrupts it (the browser then ends the smooth scroll)
    jumpTo = n;
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(endJump, TIMING.jumpTimeout);
    addEventListener('scrollend', endJump, { once: true });
    if (reduced) crossfadeTo(n);
    else if (settled === n - 1 && !wasRunning) run();   // already where this step starts
    else {
      crossfadeTo(n - 1);
      setTimeout(() => { if (g === gen) run(); }, TIMING.crossfade);
    }
  }
  scrollTo({ top: y, behavior: reduced ? 'auto' : 'smooth' });
}));

// Illustration scales to fit. Its content overflows the 500×460 map
// (card −96px left, pills −30px top / +539px right / +482px bottom).
const wrap = document.getElementById('ill-wrap');
function layout() {
  if (innerWidth < 900) {
    // map fills the container width; pills may run off the edge, as in the mobile design
    const w = wrap.clientWidth;
    const s = w / 500;
    wrap.style.height = `${512 * s}px`;
    wrap.style.width = '';
    stage.style.transform = `translate(${(w - 500 * s) / 2}px, ${30 * s}px) scale(${s})`;
  } else {
    const s = Math.min(1, (vh() - 96) / 512);
    wrap.style.width = `${500 * s}px`;
    wrap.style.height = `${460 * s}px`;
    stage.style.transform = `scale(${s})`;
  }
  if (xfadeEl) xfadeEl.style.transform = stage.style.transform;
}
addEventListener('resize', () => { layout(); onScroll(); });

bindLayers(stage);
sizeSection();
layout();
updateCopy();
onScroll();

// handy for tweaking in the console: HIW.TIMING.fade.duration = 400
window.HIW = { TIMING, S, TRANSITIONS, get state() { return { settled, target, running }; } };
</script>
</body>
</html>
